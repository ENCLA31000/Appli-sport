  };
  const COACH_UID = "SJxh30lKnChAfQlKTT59HciW5s23";
</script>

<script type="text/babel">
const { useState, useEffect } = React;

const C = {
  bg:"#0d1117", bg2:"#161b22", card:"#1c232d", line:"#2a3340",
  text:"#e7edf3", dim:"#8a97a6", lime:"#c6ff3e", limeDk:"#9ad400",
  orange:"#ff7a3c", blue:"#4aa8ff", red:"#ff5470", violet:"#b07cff", teal:"#5ad1c0",
};
// Axes des INDICATEURS (mesurés)
const CAT = {
  physique:{label:"Physique",color:C.orange,emoji:"⚡"},
  technique:{label:"Technique",color:C.lime,emoji:"🎯"},
  mental:{label:"Mental",color:C.blue,emoji:"🧠"},
};
// Catégories des EXERCICES (activités)
const EXCAT = {
  echauffement:{label:"Échauffement",color:C.orange,emoji:"🔥"},
  physique:{label:"Physique",color:C.blue,emoji:"💪"},
  technique:{label:"Technique",color:C.lime,emoji:"🎯"},
  tactique:{label:"Tactique",color:C.violet,emoji:"🧭"},
  mental:{label:"Mental",color:C.red,emoji:"🧠"},
  recup:{label:"Retour au calme",color:C.teal,emoji:"🧊"},
};

const DEFAULT_DATA = {
  player:{ name:"Mon joueur", level:"Suivi entraînement footballeur", poste:"", naissance:"" },
  exercises:[], indicators:[], readings:[], sessions:[], health:[], vmaTests:[], v:2,
};

const uid = () => Math.random().toString(36).slice(2,9);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso)=>{ try{return new Date(iso+"T00:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"short"});}catch{return iso;} };
const readingsOf = (data,id)=>[...(data.readings||[]).filter(r=>r.indicatorId===id)].sort((a,b)=>a.date.localeCompare(b.date));

// Migration ancien modèle (modules/objectives/entries) -> nouveau (indicators/readings/exercises)
function migrate(d){
  if(!d) return DEFAULT_DATA;
  if(d.v===2) return d;
  const p=d.player||{};
  const player={name:p.name||"Mon joueur",level:p.level||"Suivi entraînement footballeur",poste:p.poste||"",naissance:p.naissance||""};
  const objectives=d.objectives||[];
  const indicators=(d.modules||[]).map(m=>{
    const oid=(m.objectiveIds||[])[0];
    const o=oid?objectives.find(x=>x.id===oid):null;
    return {id:m.id,name:m.name,category:m.category||"physique",type:m.type||"note",unit:m.unit||"",
      hasGoal:!!o,min:o?o.min:0,max:o?o.max:10,direction:o?o.direction:"up"};
  });
  const readings=(d.entries||[]).map(e=>({id:e.id,indicatorId:e.moduleId,date:e.date,value:e.value,sessionId:e.sessionId||null}));
  const sessions=(d.sessions||[]).map(s=>({id:s.id,date:s.date,title:s.title||"",exerciseIds:[],comment:"",done:{}}));
  return {player,exercises:[],indicators,readings,sessions,health:d.health||[],vmaTests:d.vmaTests||[],v:2};
}

// ---- Firebase init ----
let auth=null, dbRef=null;
const configOK = !String(firebaseConfig.apiKey).includes("COLLE") && !String(COACH_UID).includes("COLLE");
if (configOK) {
  try {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    dbRef = firebase.firestore().collection("app").doc("data");
  } catch(e){}
}

// ============================================================
function App(){
  const [user,setUser]=useState(undefined);
  const [data,setData]=useState(null);
  const [tab,setTab]=useState("seances");
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState(null);
  const [editingPlayer,setEditingPlayer]=useState(false);

  useEffect(()=>{ if(!configOK) return; const unsub=auth.onAuthStateChanged(u=>setUser(u||null)); return ()=>unsub(); },[]);

  useEffect(()=>{
    if(!user){ setData(null); return; }
    const isCoach=user.uid===COACH_UID;
    const unsub=dbRef.onSnapshot(snap=>{
      if(snap.exists){
        const raw=snap.data(); const mig=migrate(raw);
        if(raw.v!==2 && isCoach){ dbRef.set(mig); }
        setData(mig);
      }
      else if(isCoach){ dbRef.set(DEFAULT_DATA); setData(DEFAULT_DATA); }
      else { setData("waiting"); }
    }, e=>setErr(e.message));
    return ()=>unsub();
  },[user]);

  if(!configOK) return <ConfigHelp/>;
  if(user===undefined) return <Splash/>;
  if(user===null) return <Login err={err} setErr={setErr}/>;
  const isCoach=user.uid===COACH_UID;

  const persist=async(next)=>{ setData(next); setSaving(true); try{ await dbRef.set(next); }catch(e){ setErr(e.message); } setTimeout(()=>setSaving(false),500); };

  if(data===null) return <Splash/>;
  if(data==="waiting") return <Waiting onLogout={()=>auth.signOut()}/>;

  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"'Hanken Grotesk',system-ui,sans-serif"}}>
      <header style={{position:"sticky",top:0,zIndex:20,background:"linear-gradient(180deg,#10161e,#0d1117)",borderBottom:`1px solid ${C.line}`,padding:"14px 16px"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,maxWidth:760,margin:"0 auto"}}>
          <div style={{width:40,height:40,borderRadius:10,flexShrink:0,background:C.lime,color:"#0d1117",display:"grid",placeItems:"center",fontWeight:900,fontSize:22}}>⚽</div>
          <div onClick={isCoach?()=>setEditingPlayer(true):undefined} style={{flex:1,minWidth:0,cursor:isCoach?"pointer":"default"}}>
            <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:17,letterSpacing:-0.3,lineHeight:1,display:"flex",alignItems:"center",gap:6}}>{data.player.name}{isCoach && <span style={{fontSize:11,opacity:.55}}>✏️</span>}</div>
            <div style={{color:C.dim,fontSize:12,marginTop:3}}>{data.player.level}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:11,fontWeight:700,color:isCoach?C.lime:C.blue}}>{isCoach?"COACH":"JOUEUR"}</div>
            <button onClick={()=>auth.signOut()} style={{background:"transparent",border:"none",color:C.dim,fontSize:11,cursor:"pointer",padding:0,textDecoration:"underline"}}>déconnexion</button>
          </div>
        </div>
      </header>

      {!isCoach && (
        <div style={{maxWidth:760,margin:"10px auto 0",padding:"0 16px"}}>
          <div style={{background:"rgba(74,168,255,.12)",border:`1px solid ${C.blue}33`,color:C.blue,fontSize:12.5,padding:"8px 12px",borderRadius:10}}>👁️ Mode joueur — consultation seule, mise à jour en direct.</div>
        </div>
      )}

      <main style={{maxWidth:760,margin:"0 auto",padding:"16px 16px 96px"}}>
        {tab==="seances" && <SeancesTab data={data} persist={persist} isCoach={isCoach}/>}
        {tab==="exercices" && <ExercicesTab data={data} persist={persist} isCoach={isCoach}/>}
        {tab==="suivi" && <SuiviTab data={data} persist={persist} isCoach={isCoach}/>}
        {tab==="vma" && <VmaTab data={data} persist={persist} isCoach={isCoach}/>}
        {tab==="sante" && <SanteTab data={data} persist={persist} isCoach={isCoach}/>}
      </main>

      <nav style={{position:"fixed",bottom:0,left:0,right:0,zIndex:20,background:"#10161e",borderTop:`1px solid ${C.line}`,display:"flex",justifyContent:"center",paddingBottom:"env(safe-area-inset-bottom)"}}>
        <div style={{display:"flex",width:"100%",maxWidth:760}}>
          {[["seances","Séances","📅"],["exercices","Exercices","🧩"],["suivi","Suivi","📈"],["vma","VMA","🏃"],["sante","Santé","❤️"]].map(([id,label,ic])=>(
            <button key={id} onClick={()=>setTab(id)} style={{flex:1,border:"none",cursor:"pointer",background:"transparent",padding:"10px 2px 12px",display:"flex",flexDirection:"column",alignItems:"center",gap:3,color:tab===id?C.lime:C.dim,borderTop:tab===id?`2px solid ${C.lime}`:"2px solid transparent",marginTop:-1}}>
              <span style={{fontSize:18}}>{ic}</span><span style={{fontSize:10.5,fontWeight:700}}>{label}</span>
            </button>
          ))}
        </div>
      </nav>

      {saving && <div style={{position:"fixed",bottom:78,right:16,background:C.card,border:`1px solid ${C.line}`,color:C.dim,fontSize:12,padding:"6px 12px",borderRadius:20,zIndex:30}}>💾 Sauvegarde…</div>}
      {err && <div onClick={()=>setErr(null)} style={{position:"fixed",bottom:78,left:16,right:16,background:C.red,color:"#fff",fontSize:12,padding:"8px 12px",borderRadius:10,zIndex:40,maxWidth:728,margin:"0 auto"}}>⚠️ {err} (toucher pour fermer)</div>}
      {editingPlayer && <PlayerEditor player={data.player} onSave={(p)=>{persist({...data,player:p});setEditingPlayer(false);}} onCancel={()=>setEditingPlayer(false)}/>}
    </div>
  );
}

// ============================================================
//  LOGIN
// ============================================================
function Login({err,setErr}){
  const [email,setEmail]=useState(""); const [pwd,setPwd]=useState(""); const [busy,setBusy]=useState(false);
  const submit=async()=>{ setErr(null); setBusy(true); try{ await auth.signInWithEmailAndPassword(email.trim(),pwd); }catch(e){ setErr(traduireErreur(e.code||e.message)); } setBusy(false); };
  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"'Hanken Grotesk',sans-serif",display:"grid",placeItems:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:360}}>
        <div style={{textAlign:"center",marginBottom:26}}>
          <div style={{width:56,height:56,borderRadius:14,background:C.lime,color:"#0d1117",display:"grid",placeItems:"center",fontSize:30,margin:"0 auto 14px"}}>⚽</div>
          <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:24}}>Suivi Footballeur</div>
          <div style={{color:C.dim,fontSize:13,marginTop:4}}>Connecte-toi pour continuer</div>
        </div>
        <div style={{display:"grid",gap:12}}>
          <input style={inp} type="email" placeholder="Adresse e-mail" value={email} onChange={e=>setEmail(e.target.value)}/>
          <input style={inp} type="password" placeholder="Mot de passe" value={pwd} onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/>
          <button style={{...btnPrimary,padding:"12px",opacity:busy?.6:1}} disabled={busy} onClick={submit}>{busy?"Connexion…":"Se connecter"}</button>
          {err && <div style={{color:C.red,fontSize:12.5,textAlign:"center"}}>{err}</div>}
        </div>
      </div>
    </div>
  );
}
function traduireErreur(code){ const m={"auth/invalid-email":"E-mail invalide.","auth/user-not-found":"Compte introuvable.","auth/wrong-password":"Mot de passe incorrect.","auth/invalid-credential":"Identifiants incorrects.","auth/too-many-requests":"Trop de tentatives, réessaie plus tard."}; return m[code]||("Erreur : "+code); }

function PlayerEditor({player,onSave,onCancel}){
  const [f,setF]=useState({name:player.name||"",level:player.level||"",poste:player.poste||"",naissance:player.naissance||""});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const age=f.naissance?Math.floor((new Date()-new Date(f.naissance+"T00:00:00"))/(365.25*24*60*60*1000)):null;
  return (
    <Modal title="Informations du joueur" onClose={onCancel}>
      <Field label="Nom du joueur"><input style={inp} value={f.name} onChange={e=>set("name",e.target.value)} placeholder="Prénom Nom"/></Field>
      <Field label="Sous-titre / catégorie"><input style={inp} value={f.level} onChange={e=>set("level",e.target.value)} placeholder="ex. U18 régional"/></Field>
      <Field label="Poste (optionnel)"><input style={inp} value={f.poste} onChange={e=>set("poste",e.target.value)} placeholder="ex. Ailier / Latéral"/></Field>
      <Field label="Date de naissance (optionnel)">
        <input type="date" style={inp} value={f.naissance} onChange={e=>set("naissance",e.target.value)}/>
        {age!=null && age>=0 && age<120 && <div style={{fontSize:12,color:C.dim,marginTop:6}}>{age} ans</div>}
      </Field>
      <div style={{display:"flex",gap:10,marginTop:18}}><button style={{...btnPrimary,flex:1}} disabled={!f.name.trim()} onClick={()=>onSave(f)}>Enregistrer</button><button style={btnGhost} onClick={onCancel}>Annuler</button></div>
    </Modal>
  );
}

// ============================================================
//  EXERCICES (bibliothèque d'activités)
// ============================================================
function ExercicesTab({data,persist,isCoach}){
  const [editing,setEditing]=useState(null);
  const save=(ex)=>{ let exercises; if(ex.id) exercises=data.exercises.map(x=>x.id===ex.id?ex:x); else exercises=[...data.exercises,{...ex,id:uid()}]; persist({...data,exercises}); setEditing(null); };
  const remove=(id)=>{ if(!window.confirm("Supprimer cet exercice ?"))return; persist({...data,exercises:data.exercises.filter(x=>x.id!==id),sessions:data.sessions.map(s=>({...s,exerciseIds:(s.exerciseIds||[]).filter(e=>e!==id)}))}); };
  return (
    <div>
      <SectionTitle title="Exercices" action={isCoach&&<AddBtn onClick={()=>setEditing({})} label="Exercice"/>}/>
      <div style={{fontSize:12.5,color:C.dim,marginBottom:16,lineHeight:1.5}}>La bibliothèque des activités à faire en séance (échauffement, ateliers, jeux…). Pas de note ni d'objectif : on les assemble dans les séances.</div>
      {data.exercises.length===0 && <Empty txt="Aucun exercice. Crées-en pour pouvoir bâtir tes séances."/>}
      {Object.entries(EXCAT).map(([key,cat])=>{
        const exs=data.exercises.filter(e=>e.category===key);
        if(exs.length===0) return null;
        return (
          <div key={key} style={{marginBottom:22}}>
            <CatHeader cat={cat} count={exs.length}/>
            <div style={{display:"grid",gap:10}}>
              {exs.map(ex=>(
                <div key={ex.id} style={{...cardStyle,borderLeft:`3px solid ${cat.color}`}}>
                  <div style={{fontWeight:700,fontSize:15}}>{ex.name}</div>
                  {ex.description && <div style={{fontSize:12.5,color:C.dim,marginTop:5,whiteSpace:"pre-wrap",lineHeight:1.5}}>{ex.description}</div>}
                  {isCoach && <div style={{display:"flex",gap:8,marginTop:12}}><SmallBtn onClick={()=>setEditing(ex)}>Modifier</SmallBtn><SmallBtn onClick={()=>remove(ex.id)} danger>Supprimer</SmallBtn></div>}
                </div>
              ))}
            </div>
          </div>
        );
      })}
      {editing && <ExerciseEditor exercise={editing} onSave={save} onCancel={()=>setEditing(null)}/>}
    </div>
  );
}
function ExerciseEditor({exercise,onSave,onCancel}){
  const [f,setF]=useState({id:exercise.id||null,name:exercise.name||"",category:exercise.category||"echauffement",description:exercise.description||""});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  return (
    <Modal title={exercise.id?"Modifier l'exercice":"Nouvel exercice"} onClose={onCancel}>
      <Field label="Nom"><input style={inp} value={f.name} onChange={e=>set("name",e.target.value)} placeholder="ex. Échauffement, Toro 4c1, Centres-tir…"/></Field>
      <Field label="Catégorie"><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{Object.entries(EXCAT).map(([k,c])=><Chip key={k} active={f.category===k} color={c.color} onClick={()=>set("category",k)}>{c.emoji} {c.label}</Chip>)}</div></Field>
      <Field label="Description / consignes (optionnel)"><textarea style={{...inp,minHeight:80,resize:"vertical"}} value={f.description} onChange={e=>set("description",e.target.value)} placeholder="Déroulé, durée, matériel, points de coaching…"/></Field>
      <div style={{display:"flex",gap:10,marginTop:8}}><button style={{...btnPrimary,flex:1}} disabled={!f.name.trim()} onClick={()=>onSave(f)}>Enregistrer</button><button style={btnGhost} onClick={onCancel}>Annuler</button></div>
    </Modal>
  );
}

// ============================================================
//  SÉANCES
// ============================================================
function SeancesTab({data,persist,isCoach}){
  const [creating,setCreating]=useState(false);
  const [openId,setOpenId]=useState(null);
  const sessions=[...data.sessions].sort((a,b)=>b.date.localeCompare(a.date));
  const add=(s)=>{ persist({...data,sessions:[...data.sessions,{...s,id:uid(),done:{},comment:""}]}); setCreating(false); };
  return (
    <div>
      <SectionTitle title="Séances" action={isCoach&&<AddBtn onClick={()=>setCreating(true)} label="Séance"/>}/>
      {sessions.length===0 && <Empty txt="Aucune séance planifiée."/>}
      <div style={{display:"grid",gap:10}}>
        {sessions.map(s=>{
          const exs=data.exercises.filter(e=>(s.exerciseIds||[]).includes(e.id));
          const doneN=Object.values(s.done||{}).filter(Boolean).length;
          const meas=(data.readings||[]).filter(r=>r.sessionId===s.id).length;
          return (
            <div key={s.id} style={cardStyle}>
              <div style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setOpenId(openId===s.id?null:s.id)}>
                <div style={{textAlign:"center",background:C.bg2,borderRadius:8,padding:"6px 10px",minWidth:50}}>
                  <div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:18,color:C.lime,lineHeight:1}}>{fmtDate(s.date).split(" ")[0]}</div>
                  <div style={{fontSize:10,color:C.dim,textTransform:"uppercase"}}>{fmtDate(s.date).split(" ")[1]}</div>
                </div>
                <div style={{flex:1}}><div style={{fontWeight:700,fontSize:15}}>{s.title||"Séance"}</div><div style={{color:C.dim,fontSize:12.5,marginTop:3}}>{exs.length} exo · {doneN} fait(s) · {meas} relevé(s)</div></div>
                <span style={{color:C.dim,fontSize:18}}>{openId===s.id?"▾":"▸"}</span>
              </div>
              {openId===s.id && <SessionDetail session={s} data={data} persist={persist} isCoach={isCoach}/>}
            </div>
          );
        })}
      </div>
      {creating && <SessionCreator data={data} onSave={add} onCancel={()=>setCreating(false)}/>}
    </div>
  );
}

function SessionDetail({session,data,persist,isCoach}){
  const [adding,setAdding]=useState(false);
  const exs=data.exercises.filter(e=>(session.exerciseIds||[]).includes(e.id));
  const measures=(data.readings||[]).filter(r=>r.sessionId===session.id);
  const updateSession=(patch)=>persist({...data,sessions:data.sessions.map(s=>s.id===session.id?{...s,...patch}:s)});
  const toggleDone=(exId)=>{ const done={...(session.done||{})}; done[exId]=!done[exId]; updateSession({done}); };
  const removeSession=()=>{ if(!window.confirm("Supprimer cette séance ?"))return; persist({...data,sessions:data.sessions.filter(s=>s.id!==session.id),readings:(data.readings||[]).map(r=>r.sessionId===session.id?{...r,sessionId:null}:r)}); };
  const saveReading=(indicatorId,value)=>{ persist({...data,readings:[...(data.readings||[]),{id:uid(),indicatorId,date:session.date,value,sessionId:session.id}]}); setAdding(false); };
  const indName=(id)=>{ const i=data.indicators.find(x=>x.id===id); return i?i.name:"Indicateur"; };
  return (
    <div style={{marginTop:14,borderTop:`1px solid ${C.line}`,paddingTop:14}}>
      <div style={{fontSize:11,fontWeight:800,color:C.dim,textTransform:"uppercase",letterSpacing:.5,marginBottom:8}}>Exercices</div>
      {exs.length===0 && <Empty txt="Aucun exercice dans cette séance."/>}
      <div style={{display:"grid",gap:8}}>
        {exs.map(ex=>{ const cat=EXCAT[ex.category]||EXCAT.echauffement; const done=!!(session.done||{})[ex.id]; return (
          <div key={ex.id} onClick={isCoach?()=>toggleDone(ex.id):undefined} style={{display:"flex",gap:10,alignItems:"flex-start",background:C.bg2,borderRadius:10,padding:11,borderLeft:`3px solid ${cat.color}`,cursor:isCoach?"pointer":"default",opacity:done?.6:1}}>
            <div style={{width:20,height:20,borderRadius:6,border:`1px solid ${done?C.lime:C.line}`,background:done?C.lime:"transparent",color:"#0d1117",display:"grid",placeItems:"center",fontWeight:900,fontSize:13,flexShrink:0,marginTop:1}}>{done?"✓":""}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:600,textDecoration:done?"line-through":"none"}}>{ex.name}</div>
              {ex.description && <div style={{fontSize:12,color:C.dim,marginTop:3,whiteSpace:"pre-wrap"}}>{ex.description}</div>}
            </div>
            <span style={{fontSize:11,color:cat.color,fontWeight:700,whiteSpace:"nowrap"}}>{cat.emoji}</span>
          </div>
        );})}
      </div>

      <div style={{fontSize:11,fontWeight:800,color:C.dim,textTransform:"uppercase",letterSpacing:.5,margin:"16px 0 8px"}}>Relevés du jour</div>
      {measures.length===0 && <div style={{fontSize:12.5,color:C.dim,fontStyle:"italic",marginBottom:8}}>Aucune mesure saisie ce jour.</div>}
      <div style={{display:"grid",gap:6}}>

function VmaTab({data,persist,isCoach}){
  const [dist,setDist]=useState(""); const [date,setDate]=useState(todayISO());
  const tests=[...(data.vmaTests||[])].sort((a,b)=>a.date.localeCompare(b.date));
  const lastTest=tests.length?tests[tests.length-1]:null;
  const d=parseFloat(dist); const calcVma=(!isNaN(d)&&d>0)?d/100:null; const refVma=calcVma||(lastTest?lastTest.vma:null);
  const allure=(v)=>{ if(!v) return "—"; const a=60/v; const m=Math.floor(a); const s=Math.round((a-m)*60); return `${m}:${String(s).padStart(2,"0")}`; };
  const vo2=(v)=> v?Math.round(v*3.5):null;
  const save=()=>{ if(!calcVma) return; const v=+calcVma.toFixed(1); persist({...data,vmaTests:[...(data.vmaTests||[]).filter(t=>t.date!==date),{id:uid(),date,distance:d,vma:v}]}); setDist(""); };
  const removeTest=(id)=>{ if(!window.confirm("Supprimer ce test ?"))return; persist({...data,vmaTests:(data.vmaTests||[]).filter(t=>t.id!==id)}); };
  const zones=[60,70,80,90,95,100,105,110];
  const vmaPts=tests.map(t=>({label:fmtDate(t.date),value:t.vma}));
  return (
    <div>
      <SectionTitle title="VMA — Test demi-Cooper"/>
      <div style={{...cardStyle,marginBottom:14}}>
        <div style={{fontSize:12.5,color:C.dim,lineHeight:1.6,marginBottom:isCoach?12:0}}><b style={{color:C.text}}>Protocole :</b> après échauffement, courir la plus grande distance possible en <b style={{color:C.lime}}>6 minutes</b>. <b style={{color:C.lime}}>VMA (km/h) = distance (m) ÷ 100</b>.</div>
        {isCoach && <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}><Field label="Date" flex><input type="date" style={inp} value={date} onChange={e=>setDate(e.target.value)}/></Field><Field label="Distance en 6 min (m)" flex><input type="number" step="any" style={inp} value={dist} onChange={e=>setDist(e.target.value)} placeholder="ex. 1500"/></Field></div>}
      </div>
      {refVma && <div style={{display:"flex",gap:10,marginBottom:14}}><Stat label="VMA" value={`${(+refVma.toFixed(1))} km/h`} accent/><Stat label="Allure" value={`${allure(refVma)}/km`}/><Stat label="VO₂max est." value={`${vo2(refVma)}`}/></div>}
      {isCoach && calcVma && <button style={{...btnPrimary,marginBottom:16,width:"100%"}} onClick={save}>Enregistrer ce test ({(+calcVma.toFixed(1))} km/h)</button>}
      {refVma && (
        <div style={{...cardStyle,marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>Allures d'entraînement</div>
          <div style={{fontSize:11.5,color:C.dim,marginBottom:12}}>Sur une VMA de {(+refVma.toFixed(1))} km/h.</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:"9px 6px",fontSize:12.5}}>
            <div style={{color:C.dim,fontWeight:700}}>% VMA</div><div style={{color:C.dim,fontWeight:700}}>km/h</div><div style={{color:C.dim,fontWeight:700}}>allure</div><div style={{color:C.dim,fontWeight:700}}>en 30 s</div>
            {zones.map(p=>{ const v=refVma*p/100; const dd=Math.round(v/3.6*30); const hot=p>=95&&p<=105; return (<React.Fragment key={p}><div style={{fontWeight:700,color:hot?C.lime:C.text}}>{p}%</div><div>{v.toFixed(1)}</div><div>{allure(v)}</div><div>{dd} m</div></React.Fragment>);})}
          </div>
          <div style={{fontSize:11,color:C.dim,marginTop:12,lineHeight:1.6}}>60-70 % endurance · 80-90 % seuil · 95-105 % travail VMA · 110 % survitesse.</div>
        </div>
      )}
      {tests.length>0 && <div style={{...cardStyle,marginBottom:14}}><div style={{fontSize:13,fontWeight:700,marginBottom:10}}>Évolution de la VMA (km/h)</div><SvgLineChart pts={vmaPts} color={C.lime}/></div>}
      {tests.length>0 && <div style={{display:"grid",gap:8}}>{[...tests].reverse().map(t=>(<div key={t.id} style={{...cardStyle,display:"flex",alignItems:"center",gap:12,padding:12}}><div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:18,color:C.lime}}>{t.vma}</div><div style={{flex:1,fontSize:12.5,color:C.dim}}>km/h · {t.distance} m en 6 min · {fmtDate(t.date)}</div>{isCoach && <SmallBtn onClick={()=>removeTest(t.id)} danger>Suppr.</SmallBtn>}</div>))}</div>}
    </div>
  );
}

// ============================================================
//  Graphique SVG + Jauge
// ============================================================
function SvgLineChart({pts,goal,color}){
  const W=560,H=200,pL=38,pR=12,pT=12,pB=28;
  const vals=pts.map(p=>p.value);
  const gv=goal?[goal.min,goal.max]:[];
  const all=[...vals,...gv];
  let lo=Math.min(...all), hi=Math.max(...all);
  if(!isFinite(lo)){lo=0;hi=10;}
  if(lo===hi){lo-=1;hi+=1;}
  const pad=(hi-lo)*0.15; lo-=pad; hi+=pad;
  const X=i=>pL+(pts.length<=1?(W-pL-pR)/2:(i/(pts.length-1))*(W-pL-pR));
  const Y=v=>pT+(1-(v-lo)/(hi-lo))*(H-pT-pB);
  const path=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.value).toFixed(1)}`).join(" ");
  const ticks=[lo,(lo+hi)/2,hi];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
      {ticks.map((t,i)=>(<g key={i}><line x1={pL} y1={Y(t)} x2={W-pR} y2={Y(t)} stroke={C.line} strokeDasharray="3 3"/><text x={pL-6} y={Y(t)+4} fill={C.dim} fontSize="11" textAnchor="end">{(+t.toFixed(1))}</text></g>))}
      {goal && <rect x={pL} y={Y(Math.max(goal.min,goal.max))} width={W-pL-pR} height={Math.abs(Y(goal.min)-Y(goal.max))} fill={color} opacity="0.07"/>}
      {goal && <line x1={pL} y1={Y(goal.max)} x2={W-pR} y2={Y(goal.max)} stroke={color} strokeDasharray="5 4" opacity="0.7"/>}
      <path d={path} fill="none" stroke={color} strokeWidth="2.5"/>
      {pts.map((p,i)=>(<g key={i}><circle cx={X(i)} cy={Y(p.value)} r="3.5" fill={color}><title>{p.label} : {p.value}</title></circle>{(i===0||i===pts.length-1)&&<text x={X(i)} y={H-8} fill={C.dim} fontSize="11" textAnchor={i===0?"start":"end"}>{p.label}</text>}</g>))}
    </svg>
  );
}

function Gauge({min,max,direction,value,color}){
  const lo=Math.min(min,max), hi=Math.max(min,max);
  let pct=0; if(value!=null&&hi!==lo) pct=((value-lo)/(hi-lo))*100;
  let progress=direction==="down"?100-pct:pct; progress=Math.max(0,Math.min(100,progress));
  const reached=value!=null&&(direction==="up"?value>=max:value<=max);
  return (
    <div style={{minWidth:90}}>
      <div style={{height:8,background:C.bg,borderRadius:4,overflow:"hidden",border:`1px solid ${C.line}`}}><div style={{width:`${value==null?0:progress}%`,height:"100%",background:reached?C.limeDk:color,transition:"width .3s"}}/></div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:4,fontSize:10.5,color:C.dim}}><span>{min}</span><span style={{color:value==null?C.dim:reached?C.limeDk:color,fontWeight:700}}>{value==null?"—":value}{reached?" ✓":""}</span><span>{max}</span></div>
    </div>
  );
}

// ============================================================
//  UI helpers
// ============================================================
const cardStyle={background:C.card,border:`1px solid ${C.line}`,borderRadius:14,padding:14};
const inp={width:"100%",background:C.bg,border:`1px solid ${C.line}`,borderRadius:10,padding:"10px 12px",color:C.text,fontSize:14,outline:"none",boxSizing:"border-box"};
const btnPrimary={background:C.lime,color:"#0d1117",border:"none",borderRadius:10,padding:"10px 16px",fontWeight:700,fontSize:14,cursor:"pointer"};
const btnGhost={background:"transparent",color:C.dim,border:`1px solid ${C.line}`,borderRadius:10,padding:"10px 16px",fontWeight:600,fontSize:14,cursor:"pointer"};
function SectionTitle({title,action}){return <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><h2 style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:22,letterSpacing:-0.5,margin:0}}>{title}</h2>{action}</div>;}
function CatHeader({cat,count}){return <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span style={{fontSize:13,fontWeight:800,color:cat.color,textTransform:"uppercase",letterSpacing:0.5}}>{cat.emoji} {cat.label}</span><span style={{flex:1,height:1,background:C.line}}/><span style={{fontSize:12,color:C.dim}}>{count}</span></div>;}
function AddBtn({onClick,label}){return <button style={btnPrimary} onClick={onClick}>+ {label}</button>;}
function SmallBtn({children,onClick,danger,accent}){const col=danger?C.red:accent?C.lime:C.dim;return <button onClick={onClick} style={{background:accent?C.lime+"14":"transparent",border:`1px solid ${col}${danger||accent?"55":""}`,color:col,borderRadius:8,padding:"6px 12px",fontSize:12.5,fontWeight:600,cursor:"pointer"}}>{children}</button>;}
function Chip({children,active,color,onClick}){return <button onClick={onClick} style={{background:active?color:"transparent",color:active?"#0d1117":C.dim,border:`1px solid ${active?color:C.line}`,borderRadius:20,padding:"7px 13px",fontSize:12.5,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{children}</button>;}
function Field({label,children,flex}){return <div style={{marginBottom:14,flex:flex?1:"none"}}><label style={{display:"block",fontSize:12,color:C.dim,fontWeight:600,marginBottom:6}}>{label}</label>{children}</div>;}
function Stat({label,value,accent}){return <div style={{...cardStyle,flex:1,textAlign:"center",padding:14}}><div style={{fontSize:11,color:C.dim,textTransform:"uppercase",letterSpacing:0.5}}>{label}</div><div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:20,color:accent?C.lime:C.text,marginTop:4}}>{value}</div></div>;}
function Empty({txt}){return <div style={{color:C.dim,fontSize:13,padding:"14px 0",textAlign:"center"}}>{txt}</div>;}
function Modal({title,children,onClose}){
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:50,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.bg2,borderRadius:"18px 18px 0 0",border:`1px solid ${C.line}`,width:"100%",maxWidth:560,maxHeight:"88vh",overflowY:"auto",padding:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}><h3 style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:19,margin:0}}>{title}</h3><button onClick={onClose} style={{background:"transparent",border:"none",color:C.dim,fontSize:24,cursor:"pointer",lineHeight:1}}>×</button></div>
        {children}
      </div>
    </div>
  );
}
function Splash(){return <div style={{minHeight:"100vh",background:C.bg,color:C.dim,display:"grid",placeItems:"center",fontFamily:"sans-serif"}}>Chargement…</div>;}
function Waiting({onLogout}){return <div style={{minHeight:"100vh",background:C.bg,color:C.text,display:"grid",placeItems:"center",fontFamily:"'Hanken Grotesk',sans-serif",padding:24,textAlign:"center"}}><div><div style={{fontSize:34,marginBottom:12}}>⏳</div><div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:20}}>En attente du coach</div><div style={{color:C.dim,fontSize:13,marginTop:8,maxWidth:300}}>Le suivi apparaîtra dès que le coach aura saisi les premières données.</div><button style={{...btnGhost,marginTop:18}} onClick={onLogout}>Déconnexion</button></div></div>;}
function ConfigHelp(){return <div style={{minHeight:"100vh",background:C.bg,color:C.text,display:"grid",placeItems:"center",fontFamily:"'Hanken Grotesk',sans-serif",padding:24,textAlign:"center"}}><div style={{maxWidth:380}}><div style={{fontSize:34,marginBottom:12}}>⚙️</div><div style={{fontFamily:"'Archivo',sans-serif",fontWeight:800,fontSize:20}}>Configuration requise</div><div style={{color:C.dim,fontSize:13.5,marginTop:10,lineHeight:1.6}}>Renseigne <b style={{color:C.lime}}>firebaseConfig</b> et <b style={{color:C.lime}}>COACH_UID</b> dans le fichier.</div></div></div>;}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
